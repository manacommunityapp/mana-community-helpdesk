server:
  port: 8098

spring:
  application:
    name: mana-community-helpdesk
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:manacommunity}
    username: ${DB_USERNAME:mana}
    password: ${DB_PASSWORD:mana_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: manacommunity
        format_sql: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    issuer: ${JWT_ISSUER:mana-community}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# SLA watchdog schedule
helpdesk:
  sla:
    watchdog-interval-ms: 60000   # check every 60 seconds

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.manacommunity.helpdesk: INFO
    org.hibernate.SQL: WARN
